name: Nuvo CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Build Nuvo
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build Nuvo
        run: npm run build

      # Package Nuvo locally
      - name: Create Nuvo package
        run: |
          mkdir -p artifacts
          npm pack --pack-destination ./artifacts

      # Build example against the NEW Nuvo build
      - name: Install example dependencies
        working-directory: example
        run: npm ci

      - name: Install local Nuvo package
        working-directory: example
        run: npm install --no-save --package-lock=false ../artifacts/nuvo-js-core-*.tgz

      - name: Build example
        working-directory: example
        run: npm run build
